<div class="mp" id="mp-root" tabindex="0" aria-label="Music player">
    <section class="mp-player" id="mp-player">
        <div class="mp-cover panel"><img id="mp-cover" alt="" draggable="false"></div>
        <div class="mp-info">
            <h2 id="mp-title" class="ellipsis">Nothing playing</h2>
            <p id="mp-sub" class="muted ellipsis">Pick a song from your library</p>
        </div>
        <div class="mp-seek">
            <span id="mp-cur" class="mono">0:00</span>
            <input type="range" id="mp-seek" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
            <span id="mp-dur" class="mono">0:00</span>
        </div>
        <div class="mp-controls">
            <button class="btn btn--ghost btn--icon" id="mp-shuffle" title="Shuffle" aria-pressed="false"><svg class="icon"><use href="/assets/images/icons.svg#shuffle"/></svg></button>
            <button class="btn btn--icon" id="mp-prev" title="Previous" aria-label="Previous"><svg class="icon"><use href="/assets/images/icons.svg#skip-back"/></svg></button>
            <button class="btn btn--primary btn--icon mp-play" id="mp-play" title="Play / Pause (Space)" aria-label="Play"><svg class="icon"><use href="/assets/images/icons.svg#play"/></svg></button>
            <button class="btn btn--icon" id="mp-next" title="Next" aria-label="Next"><svg class="icon"><use href="/assets/images/icons.svg#skip-forward"/></svg></button>
            <button class="btn btn--ghost btn--icon" id="mp-repeat" title="Repeat: off" aria-pressed="false"><svg class="icon"><use href="/assets/images/icons.svg#repeat"/></svg></button>
        </div>
        <div class="mp-bottom">
            <div class="mp-volume">
                <button class="btn btn--ghost btn--icon btn--sm" id="mp-mute" title="Mute (M)" aria-label="Mute"><svg class="icon"><use href="/assets/images/icons.svg#volume-2"/></svg></button>
                <input type="range" id="mp-volume" min="0" max="100" value="80" aria-label="Volume">
            </div>
            <button class="btn" id="mp-open-library" type="button"><svg class="icon"><use href="/assets/images/icons.svg#list"/></svg>Playlists</button>
        </div>
    </section>

    <section class="mp-library" id="mp-library" hidden aria-label="Playlists and library">
        <div class="toolbar">
            <button class="btn btn--ghost btn--icon" id="mp-back" title="Back to player" aria-label="Back"><svg class="icon"><use href="/assets/images/icons.svg#arrow-left"/></svg></button>
            <div class="mp-tabs" role="tablist">
                <button class="btn btn--sm is-active" role="tab" data-tab="playlists">Playlists</button>
                <button class="btn btn--sm" role="tab" data-tab="library">Library</button>
            </div>
            <span class="grow"></span>
            <button class="btn btn--sm btn--primary" id="mp-new" type="button"><svg class="icon"><use href="/assets/images/icons.svg#plus"/></svg>Playlist</button>
        </div>
        <div class="mp-search"><input class="input" id="mp-filter" type="search" placeholder="Filter" aria-label="Filter"></div>
        <div class="mp-list" id="mp-list"></div>
    </section>
</div>

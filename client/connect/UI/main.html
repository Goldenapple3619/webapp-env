<main class="cx">
    <form class="cx-card panel" id="cx-form" novalidate>
        <header class="cx-head">
            <h1>webapp-env</h1>
            <p class="muted" id="cx-subtitle">Sign in to your desktop</p>
        </header>

        <p class="cx-notice" id="cx-notice" role="status" hidden></p>

        <div class="ui-field">
            <label for="cx-user">Username</label>
            <input class="input" id="cx-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="ui-field">
            <label for="cx-pass">Password</label>
            <input class="input" id="cx-pass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="ui-field" id="cx-confirm-field" hidden>
            <label for="cx-pass2">Repeat password</label>
            <input class="input" id="cx-pass2" type="password" autocomplete="new-password">
        </div>

        <div class="ui-error" id="cx-error" role="alert"></div>

        <button class="btn btn--primary cx-submit" id="cx-submit" type="submit">Sign in</button>
        <button class="btn btn--ghost" id="cx-toggle" type="button" hidden>Create an account</button>

        <details class="cx-advanced">
            <summary>Server</summary>
            <div class="ui-field">
                <label for="cx-host">Use a different server (leave empty for this one)</label>
                <input class="input" id="cx-host" placeholder="https://my-server.example" autocomplete="off" spellcheck="false">
            </div>
        </details>
    </form>
</main>

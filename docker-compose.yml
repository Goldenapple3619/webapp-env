version: '3'

volumes:
  db-data:
  system:
    driver: local
    driver_opts:
        o: bind
        type: none
        device: ./system

networks:
  client-tier:
  api-tier:
  socket-tier:

services:
  db:
    image: "postgres:15"
    networks:
      - api-tier
      - socket-tier
    volumes:
      - ./config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  client:
    depends_on:
      api:
        condition: service_started
    build:
      context: client
    networks:
      - client-tier
    ports:
      - "${WEBSERVER_PORT}:80"
    restart: on-failure

  api:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: api
    networks:
      - api-tier
    volumes:
      - system:/mnt/system
    links:
      - db
    ports:
      - "${API_PORT}:80"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - SALT=${SALT}
    restart: on-failure

  socket:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: socket
    networks:
      - socket-tier
    volumes:
      - system:/mnt/system
    links:
      - db
    ports:
      - "${SOCKET_PORT}:80"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
    restart: on-failure

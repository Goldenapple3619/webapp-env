name: webapp-env

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_HOST: db

networks:
  edge:
  backend:
    internal: true
  sandbox:
    internal: true

volumes:
  db-data:

services:
  db:
    image: postgres:15
    restart: unless-stopped
    networks: [backend]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      <<: *db-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  init-system:
    image: alpine:3.20
    restart: "no"
    network_mode: none
    volumes:
      - ${SYSTEM_DIR:-./system}:/mnt/system
    command: >
      sh -c 'mkdir -p /mnt/system && [ "$$(stat -c %u /mnt/system)" = "10001" ] || chown -R 10001:10001 /mnt/system'

  api:
    build: ./api
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, backend]
    stop_grace_period: 15s
    depends_on:
      db: { condition: service_healthy }
      init-system: { condition: service_completed_successfully }
    volumes:
      - ${SYSTEM_DIR:-./system}:/mnt/system
    environment:
      <<: *db-env
      NODE_ENV: production
      SALT: ${SALT:?set SALT in .env (keep the value of your previous installation, it is the password pepper)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 48)}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-90}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-auto}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMITS: ${RATE_LIMITS:-on}
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-1200}
      MAX_CONCURRENT_ZIPS: ${MAX_CONCURRENT_ZIPS:-2}
    logging: *logging

  socket:
    build: ./socket
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, backend, sandbox]
    stop_grace_period: 15s
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }
      init-system: { condition: service_completed_successfully }
      runner: { condition: service_healthy }
    volumes:
      - ${SYSTEM_DIR:-./system}:/mnt/system
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (same value as the api)}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      RUNNER_URL: http://runner:8002
      RUNNER_TOKEN: ${RUNNER_TOKEN}
    logging: *logging

  web:
    build: ./client
    restart: unless-stopped
    <<: *hardening
    networks:
      edge:
    depends_on:
      api: { condition: service_healthy }
      socket: { condition: service_healthy }
    environment:
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-'self' ws: wss:}"
      CSP_REMOTE_SRC: "${CSP_REMOTE_SRC:-}"
      DNS_RESOLVER: "${DNS_RESOLVER:-127.0.0.11}"
    logging: *logging

  runner:
    build: ./runner
    restart: unless-stopped
    user: "10001:10001"
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set a random secret of 32+ characters}
      USERS_ROOT: /mnt/system/users
      RUNNER_MAX_JOBS: "4"
      RUNNER_PER_USER: "2"
      # RUNNER_MOUNT_PROC: "0"
    volumes:
      - ${SYSTEM_DIR:-./system}:/mnt/system
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/runner:uid=10001,gid=10001,mode=0755,size=1m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    pids_limit: 768
    mem_limit: 4g
    cpus: 4

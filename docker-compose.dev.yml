services:
  db:
    ports: ["127.0.0.1:5432:5432"]
  api:
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    command: ["node", "--watch", "index.js"]
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      LOG_LEVEL: debug
      RATE_LIMITS: "off"
  socket:
    ports: ["127.0.0.1:${SOCKET_PORT:-8001}:8001"]
  web:
    volumes:
      - ./client:/usr/share/nginx/html:ro
